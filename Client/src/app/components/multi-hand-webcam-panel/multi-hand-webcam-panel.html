<div [class]="compactMode ? 'w-full h-full bg-black relative flex items-center justify-center overflow-hidden' : 'bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden shrink-0'">
  @if (!compactMode) {
    <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
      <h2 class="font-medium text-gray-700 text-sm">Webcam Input (2 Hands)</h2>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" class="sr-only peer" [checked]="webcamService.isWebcamOn()" (change)="toggleWebcam()">
        <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
      </label>
    </div>
  }
  
  <div [class]="compactMode ? 'w-full h-full relative flex items-center justify-center' : 'p-4 flex justify-center items-center bg-gray-50 min-h-[250px] relative'">
    <div [class]="compactMode ? 'w-full h-full relative' : 'relative w-full overflow-hidden rounded-md shadow-sm border border-gray-200'" [hidden]="!webcamService.isWebcamOn()">
      <video #webcamVideo id="globalMultiHandWebcamVideo" autoplay playsinline muted class="w-full h-full object-cover" style="transform: scaleX(-1);"></video>
      <canvas #overlayCanvas class="absolute top-0 left-0 w-full h-full pointer-events-none" style="transform: scaleX(-1);"></canvas>
    </div>
    
    @if (!webcamService.isWebcamOn()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400" [class.text-[10px]]="compactMode" [class.text-sm]="!compactMode">
        <svg [class]="compactMode ? 'w-6 h-6 mb-1 opacity-50' : 'w-12 h-12 mb-2 opacity-50'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        {{ compactMode ? 'Off' : 'Camera is off' }}
      </div>
    }
  </div>
</div>
