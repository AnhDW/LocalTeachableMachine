<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden shrink-0">
  <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center group">
    <input type="text" [ngModel]="cls.name" (ngModelChange)="updateName($event)" class="font-medium text-gray-700 text-lg border-none focus:ring-0 p-0 hover:bg-gray-50 transition-colors rounded">
    <button (click)="removeClass()" class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
    </button>
  </div>
  <div class="p-4 flex gap-4">
    <div class="flex flex-col gap-2 w-1/4 border-r border-gray-100 pr-4">
      <div class="text-xs text-gray-500 font-medium uppercase tracking-wider text-center">Add Image Samples</div>
      <button 
        (mousedown)="startRecording()" 
        (mouseup)="stopRecording()" 
        (mouseleave)="stopRecording()"
        class="w-full mt-2 py-8 bg-blue-100 text-blue-600 hover:bg-blue-200 active:bg-blue-300 rounded-lg flex flex-col items-center justify-center transition-colors border border-blue-200 shadow-sm cursor-pointer select-none">
        <svg class="w-8 h-8 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="font-medium text-sm">Hold to Record</span>
      </button>
      <div class="text-center mt-2 text-sm font-bold text-gray-700">{{cls.samples.length}} image samples</div>
    </div>
    <div class="w-3/4 flex flex-wrap gap-2 content-start max-h-48 overflow-y-auto">
      
      @if (cls.samples.length === 0) {
        <div class="w-full h-full flex items-center justify-center text-sm text-gray-400 italic border-2 border-dashed border-gray-200 rounded-lg">
          No images yet. Hold the record button to capture.
        </div>
      }

      @for (sample of cls.samples; track $index) {
        <div class="relative w-16 h-16 rounded overflow-hidden group shadow-sm border border-gray-200">
          <img [src]="sample" class="w-full h-full object-cover">
          <button (click)="removeSample($index)" class="absolute top-0 right-0 bg-red-500 text-white w-5 h-5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-bl">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      }
    </div>
  </div>
</div>
